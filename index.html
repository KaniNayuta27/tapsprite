<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>触控精灵 · 电脑控制台</title>
  <style>
    :root {
      --bg: #0b0d0c;
      --elevated: #141816;
      --fg: #eef2ef;
      --muted: #8b948e;
      --accent: #c5d4cc;
      --danger: #c45c4a;
      --border: color-mix(in srgb, #eef2ef 14%, transparent);
      --radius-md: 12px;
      --radius-xl: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: "Segoe UI", "Noto Sans SC", system-ui, sans-serif; }
    body { min-height: 100vh; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    .kicker { font-size: 11px; letter-spacing: 0.16em; color: var(--muted); font-weight: 500; }
    h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.03em; margin: 8px 0 6px; }
    .lede { color: var(--muted); line-height: 1.55; max-width: 42em; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.05fr 0.95fr; } }
    .card { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 18px; }
    .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .pill { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .pill.on { color: var(--bg); background: var(--accent); border-color: transparent; }
    textarea, input {
      width: 100%; border-radius: var(--radius-md);
      background: var(--bg); color: var(--accent); border: 1px solid var(--border);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
      font-size: 15px; line-height: 1.55; padding: 12px 14px; outline: none;
    }
    textarea { min-height: 220px; resize: vertical; font-size: 13px; }
    textarea:focus, input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    input { letter-spacing: 0.28em; text-transform: uppercase; text-align: center; font-size: 22px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      font-family: inherit; font-weight: 600; font-size: 14px; border: 0; cursor: pointer;
      border-radius: var(--radius-md); padding: 12px 16px; min-height: 44px;
    }
    button.primary { background: var(--fg); color: var(--bg); }
    button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .log {
      height: 340px; overflow: auto; background: var(--bg); border-radius: var(--radius-md);
      border: 1px solid var(--border); padding: 12px 14px;
      font-family: ui-monospace, "SF Mono", monospace; font-size: 12.5px; line-height: 1.6;
    }
    .log .t { color: var(--muted); margin-right: 8px; }
    .err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
    .ok { color: var(--accent); }
    .gate { max-width: 420px; margin: 48px auto; text-align: center; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 10px; }
    .hidden { display: none; }
    .snips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .snips button { font-size: 12px; font-weight: 500; padding: 8px 10px; min-height: 36px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="hidden"></div>
    <div id="app">
      <div class="kicker">TAPSPRITE CONSOLE</div>
      <h1>触控精灵</h1>
      <p class="lede">电脑打开这个网页就能下发。手机 App 开着即可，不用填房间码。</p>
      <div class="grid">
        <section class="card">
          <h2>脚本</h2>
          <div class="meta" id="meta"></div>
          <textarea id="script" spellcheck="false"></textarea>
          <div class="snips" id="snips"></div>
          <div class="row">
            <button class="primary" id="send">发送到手机</button>
            <button class="ghost" id="sendRun">发送并运行</button>
            <button class="ghost" id="start">开始</button>
            <button class="ghost" id="stop">停止</button>
          </div>
          <div class="err" id="err"></div>
        </section>
        <section class="card">
          <h2>实时日志</h2>
          <div class="log" id="log"></div>
        </section>
      </div>
    </div>
  </div>
  <script src="/mqtt.min.js"></script>
  <script>
    const DEFAULT_SCRIPT = 'KeyPress "Home"\nDelay 1000\nTap 167,775\nDelay 2000\nKeyPress "Back"\nDelay 2000\nToast "脚本结束"\nDelay 1000\n';
    const SNIPS = [
      { n: "8步测试", s: DEFAULT_SCRIPT },
      { n: "自检", s: "SelfTest\n" },
      { n: "取色器", s: "PickColor\n" },
      { n: "屏幕", s: "GetScreen\n" },
      { n: "取色", s: "GetPixelColor 100,200\n" },
      { n: "找色", s: "FindColor 0,0,1080,2400,\"FFFFFF\",0,0\n" },
      { n: "多点色", s: "FindMultiColor 0,0,1080,2400,\"CC7B00\",\"20|31|CC7B00\",0,1\n" },
      { n: "滑动", s: "Swipe 800,1200,200,1200,250\n" },
      { n: "提示", s: "Tip 电脑下发的提示\n" },
      { n: "配置", s: "ReadUIConfig \"多选框1\"\n" }
    ];
    const gateEl = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const roomInput = document.getElementById("roomInput");
    const scriptEl = document.getElementById("script");
    const logEl = document.getElementById("log");
    const errEl = document.getElementById("err");
    const metaEl = document.getElementById("meta");
    let room = "";
    let after = 0;
    const seen = new Set();
    let timer = 0;
    let mq = null;
    let lastMqtt = 0;
    function addLog(msg) {
      const row = document.createElement("div");
      row.innerHTML = '<span class="t">' + fmt(Date.now()) + "</span>" + escapeHtml(msg);
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function mqttPub(obj) {
      if (mq && mq.connected) {
        mq.publish("tapsprite/live/pc", JSON.stringify(obj), { qos: 1 });
        return true;
      }
      return false;
    }
    function mqttJoin() {
      if (typeof mqtt === "undefined") {
        addLog("MQTT 库未加载，仍走网页接口");
        return;
      }
      if (mq) {
        try { mq.end(true); } catch (e) {}
      }
      mq = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
        clientId: "ts-pc-" + Math.random().toString(16).slice(2, 10),
        reconnectPeriod: 2000,
        connectTimeout: 8000
      });
      mq.on("connect", function () {
        mq.subscribe("tapsprite/live/phone");
        addLog("MQTT 通道已打开");
      });
      mq.on("reconnect", function () { /* quiet */ });
      mq.on("error", function (e) { addLog("MQTT " + (e && e.message ? e.message : e)); });
      mq.on("message", function (_t, payload) {
        lastMqtt = Date.now();
        let data = {};
        try { data = JSON.parse(payload.toString()); } catch (e) { return; }
        metaEl.innerHTML = "";
        metaEl.appendChild(pill("手机在线", true));
        metaEl.appendChild(pill(data.running ? "运行中" : "待命", !!data.running));
        metaEl.appendChild(pill(data.a11y ? "无障碍已开" : "无障碍未开", !!data.a11y));
        metaEl.appendChild(pill(data.step || "—", false));
      });
    }

    function norm(s) {
      return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    }
    function pill(text, on) {
      const s = document.createElement("span");
      s.className = "pill" + (on ? " on" : "");
      s.textContent = text;
      return s;
    }
    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(t) {
      const d = new Date(t);
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    async function getJSON(url, opt) {
      const r = await fetch(url, opt);
      const t = await r.text();
      try { return { ok: r.ok, status: r.status, data: JSON.parse(t) }; }
      catch { return { ok: r.ok, status: r.status, data: { error: t } }; }
    }
    function enter(code) {
      room = norm(code);
      if (room.length < 4) {
        alert("房间码至少 4 位");
        return;
      }
      location.hash = room;
      localStorage.setItem("tapsprite.room", room);
      after = 0;
      seen.clear();
      logEl.innerHTML = "";
      if (!scriptEl.value) scriptEl.value = DEFAULT_SCRIPT;
      poll();
      mqttJoin();
      if (timer) clearInterval(timer);
      timer = setInterval(poll, 700);
    }
    function leave() {}
    async function poll() {
      if (!room) return;
      const { ok, data } = await getJSON("/api/room/" + room + "?after=" + after);
      if (!ok) {
        errEl.textContent = (data && data.error) || "房间连不上";
        return;
      }
      metaEl.innerHTML = "";
      const phoneOn = (lastMqtt && Date.now() - lastMqtt < 8000) || (data.phoneSeenAt && (Date.now() - data.phoneSeenAt < 20000));
      metaEl.appendChild(pill(phoneOn ? "手机在线" : "等待手机", phoneOn));
      metaEl.appendChild(pill(data.running ? "运行中" : "待命", !!data.running));
      metaEl.appendChild(pill(data.a11y ? "无障碍已开" : "无障碍未开", !!data.a11y));
      metaEl.appendChild(pill(data.step || "—", false));
      if (data.script && !scriptEl.dataset.touched) scriptEl.value = data.script;
      const lines = data.lines || [];
      for (const line of lines) {
        if (seen.has(line.seq)) continue;
        seen.add(line.seq);
        after = Math.max(after, line.seq);
        const row = document.createElement("div");
        row.innerHTML = '<span class="t">' + fmt(line.t) + "</span>" + escapeHtml(line.msg);
        logEl.appendChild(row);
      }
      if (lines.length) logEl.scrollTop = logEl.scrollHeight;
    }
    async function send(run) {
      errEl.textContent = "";
      errEl.className = "err";
      const body = JSON.stringify({ script: scriptEl.value, run: !!run });
      const viaMqtt = mqttPub({ type: "script", script: scriptEl.value, run: !!run });
      const { ok, data } = await getJSON("/api/room/" + room + "/script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body
      });
      if (viaMqtt) {
        errEl.className = "err ok";
        errEl.textContent = run ? "已通过 MQTT 下发并请求运行" : "已通过 MQTT 发送";
        setTimeout(() => { errEl.textContent = ""; errEl.className = "err"; }, 1800);
        if (ok) return;
        return;
      }
      if (!ok) {
        errEl.textContent = (data && data.error) || "发送失败";
        return;
      }
      errEl.className = "err ok";
      errEl.textContent = run ? "已下发并请求运行" : "已发送到房间，等手机拉取";
      setTimeout(() => { errEl.textContent = ""; errEl.className = "err"; }, 1800);
    }
    async function control(action) {
      mqttPub({ type: "control", action: action });
      await getJSON("/api/room/" + room + "/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
    }
    const snips = document.getElementById("snips");
    if (snips) {
      SNIPS.forEach((item) => {
        const b = document.createElement("button");
        b.className = "ghost";
        b.textContent = item.n;
        b.onclick = () => {
          scriptEl.value = item.s;
          scriptEl.dataset.touched = "1";
        };
        snips.appendChild(b);
      });
    }
    document.getElementById("send").onclick = () => send(false);
    document.getElementById("sendRun").onclick = () => send(true);
    document.getElementById("start").onclick = () => control("start");
    document.getElementById("stop").onclick = () => control("stop");
    scriptEl.addEventListener("input", () => { scriptEl.dataset.touched = "1"; });
    enter("LIVE");
  </script>
</body>
</html>
