<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>触控精灵 · 电脑控制台</title>
  <style>
    :root {
      --bg: #0b0d0c;
      --elevated: #141816;
      --fg: #eef2ef;
      --muted: #8b948e;
      --accent: #c5d4cc;
      --danger: #c45c4a;
      --border: color-mix(in srgb, #eef2ef 14%, transparent);
      --radius-md: 12px;
      --radius-xl: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: "Segoe UI", "Noto Sans SC", system-ui, sans-serif; }
    body { min-height: 100vh; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    .kicker { font-size: 11px; letter-spacing: 0.16em; color: var(--muted); font-weight: 500; }
    h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.03em; margin: 8px 0 6px; }
    .lede { color: var(--muted); line-height: 1.55; max-width: 42em; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.05fr 0.95fr; } }
    .card { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 18px; }
    .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .pill { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .pill.on { color: var(--bg); background: var(--accent); border-color: transparent; }
    textarea, input {
      width: 100%; border-radius: var(--radius-md);
      background: var(--bg); color: var(--accent); border: 1px solid var(--border);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
      font-size: 15px; line-height: 1.55; padding: 12px 14px; outline: none;
    }
    textarea { min-height: 220px; resize: vertical; font-size: 13px; }
    textarea:focus, input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    input { letter-spacing: 0.28em; text-transform: uppercase; text-align: center; font-size: 22px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      font-family: inherit; font-weight: 600; font-size: 14px; border: 0; cursor: pointer;
      border-radius: var(--radius-md); padding: 12px 16px; min-height: 44px;
    }
    button.primary { background: var(--fg); color: var(--bg); }
    button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .log {
      height: 340px; overflow: auto; background: var(--bg); border-radius: var(--radius-md);
      border: 1px solid var(--border); padding: 12px 14px;
      font-family: ui-monospace, "SF Mono", monospace; font-size: 12.5px; line-height: 1.6;
    }
    .log .t { color: var(--muted); margin-right: 8px; }
    .err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
    .ok { color: var(--accent); }
    .gate { max-width: 420px; margin: 48px auto; text-align: center; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 10px; }
    .hidden { display: none; }
    .snips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .snips button { font-size: 12px; font-weight: 500; padding: 8px 10px; min-height: 36px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="hidden"></div>
    <div id="app">
      <div class="kicker">TAPSPRITE CONSOLE</div>
      <h1>触控精灵</h1>
      <p class="lede">电脑打开这个网页就能下发。手机 App 开着即可，不用填房间码。</p>
      <div class="grid">
        <section class="card">
          <h2>脚本</h2>
          <div class="meta" id="meta"></div>
          <textarea id="script" spellcheck="false"></textarea>
          <div class="snips" id="snips"></div>
          <div class="row">
            <button class="primary" id="send">发送到手机</button>
            <button class="ghost" id="sendRun">发送并运行</button>
            <button class="ghost" id="start">开始</button>
            <button class="ghost" id="stop">停止</button>
          </div>
          <div class="err" id="err"></div>
        </section>
        <section class="card">
          <h2>实时日志</h2>
          <div class="log" id="log"></div>
        </section>
      </div>
      <section class="card" style="margin-top:16px">
        <h2>抓抓</h2>
        <p class="lede" style="margin:0 0 12px">点「截图」拉当前手机画面。鼠标移动显示手机坐标和颜色。App 里先开截屏权限。</p>
        <div class="row" style="margin-top:0">
          <button class="primary" id="shot">截图</button>
        </div>
        <canvas id="grab" style="width:100%;margin-top:12px;border-radius:12px;background:#0b0d0c;cursor:crosshair"></canvas>
      </section>
      <div id="lens" style="position:fixed;display:none;pointer-events:none;z-index:80">
        <canvas id="lensCv" width="120" height="120" style="display:block;background:#111;border:1px solid #333"></canvas>
        <div id="lensTxt" style="margin-top:4px;padding:4px 6px;background:#111;color:#eee;font:12px ui-monospace,monospace;white-space:nowrap"></div>
      </div>
      </div>
    </div>
  </div>
  <script src="/mqtt.min.js"></script>
  <script>
    const DEFAULT_SCRIPT = 'KeyPress "Home"\nDelay 1000\nTap 167,775\nDelay 2000\nKeyPress "Back"\nDelay 2000\nToast "脚本结束"\nDelay 1000\n';
    const SNIPS = [
      { n: "8步测试", s: DEFAULT_SCRIPT },
      { n: "自检", s: "SelfTest\n" },
      { n: "取色器", s: "PickColor\n" },
      { n: "屏幕", s: "GetScreen\n" },
      { n: "取色", s: "GetPixelColor 100,200\n" },
      { n: "找色", s: "FindColor 0,0,1080,2400,\"FFFFFF\",0,0\n" },
      { n: "多点色", s: "FindMultiColor 0,0,1080,2400,\"CC7B00\",\"20|31|CC7B00\",0,1\n" },
      { n: "滑动", s: "Swipe 800,1200,200,1200,250\n" },
      { n: "提示", s: "Tip 电脑下发的提示\n" },
      { n: "配置", s: "ReadUIConfig \"多选框1\"\n" }
    ];
    const gateEl = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const roomInput = document.getElementById("roomInput");
    const scriptEl = document.getElementById("script");
    const logEl = document.getElementById("log");
    const errEl = document.getElementById("err");
    const metaEl = document.getElementById("meta");
    let room = "";
    let after = 0;
    const seen = new Set();
    let timer = 0;
    let mq = null;
    let lastMqtt = 0;
    let lastBeatLog = 0;
    let mqttOnce = false;
    let lastPhone = null;
    function addLog(msg) {
      const row = document.createElement("div");
      row.innerHTML = '<span class="t">' + fmt(Date.now()) + "</span>" + escapeHtml(msg);
      logEl.appendChild(row);
      while (logEl.childNodes.length > 200) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function mqttPub(obj) {
      if (mq && mq.connected) {
        mq.publish("tapsprite/live/pc", JSON.stringify(obj), { qos: 1 });
        addLog("已下发 → 手机  " + (obj.type || (obj.script ? "script" : JSON.stringify(obj).slice(0, 40))));
        return true;
      }
      addLog("网页 MQTT 还没连上，改走 HTTP");
      return false;
    }
    function mqttJoin() {
      if (typeof mqtt === "undefined") {
        addLog("MQTT 库未加载，仍走网页接口");
        return;
      }
      if (mq) {
        try { mq.end(true); } catch (e) {}
      }
      addLog("网页正在连 wss://broker.emqx.io:8084/mqtt");
      mq = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
        clientId: "ts-pc-" + Math.random().toString(16).slice(2, 10),
        reconnectPeriod: 2000,
        connectTimeout: 8000
      });
      mq.on("connect", function () {
        mq.subscribe("tapsprite/live/phone", function (err) {
          if (err) addLog("订阅失败 " + err.message);
          else {
            addLog("已订阅 tapsprite/live/phone ，等手机心跳");
            mq.publish("tapsprite/live/phone", JSON.stringify({ probe: true, from: "web" }), { qos: 0 });
            addLog("网页自测已发。若下一行出现「网页自测收到」，说明网页通道正常。");
          }
        });
        addLog(mqttOnce ? "MQTT 重连成功" : "网页 MQTT 已连接");
        mqttOnce = true;
        setTimeout(function () {
          if (!lastMqtt) addLog("5 秒还没有手机心跳。手机保持 App 开着，不要点检测连接。");
        }, 5000);
      });
      mq.on("reconnect", function () { addLog("网页 MQTT 重连中…"); });
      mq.on("offline", function () { addLog("网页 MQTT 离线"); });
      mq.on("close", function () { addLog("网页 MQTT 关闭"); });
      mq.on("error", function (e) { addLog("网页 MQTT 错误 " + (e && e.message ? e.message : e)); });
      mq.on("message", function (topic, payload) {
        let data = {};
        try { data = JSON.parse(payload.toString()); } catch (e) {
          addLog("消息不是 JSON: " + payload.toString().slice(0, 80));
          return;
        }
        if (data.probe) {
          addLog("网页自测收到，网页订阅正常。");
          return;
        }
        if (data.type === "shot" && data.jpeg) {
          showShot(data);
          return;
        }
        lastMqtt = Date.now();
        lastPhone = data;
        metaEl.innerHTML = "";
        metaEl.appendChild(pill("手机在线", true));
        metaEl.appendChild(pill(data.running ? "运行中" : "待命", !!data.running));
        metaEl.appendChild(pill(data.a11y ? "无障碍已开" : "无障碍未开", !!data.a11y));
        metaEl.appendChild(pill(data.step || "—", false));
        // 心跳日志暂时关掉
        // if (Date.now() - lastBeatLog > 4000) {
        //   lastBeatLog = Date.now();
        //   addLog("手机心跳  loaded=" + data.loaded + " a11y=" + data.a11y + " step=" + (data.step || ""));
        // }
      });
    }

    function norm(s) {
      return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    }
    function pill(text, on) {
      const s = document.createElement("span");
      s.className = "pill" + (on ? " on" : "");
      s.textContent = text;
      return s;
    }
    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(t) {
      const d = new Date(t);
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    async function getJSON(url, opt) {
      const r = await fetch(url, opt);
      const t = await r.text();
      try { return { ok: r.ok, status: r.status, data: JSON.parse(t) }; }
      catch { return { ok: r.ok, status: r.status, data: { error: t } }; }
    }
    function enter(code) {
      room = norm(code);
      if (room.length < 4) {
        alert("房间码至少 4 位");
        return;
      }
      location.hash = room;
      localStorage.setItem("tapsprite.room", room);
      after = 0;
      seen.clear();
      logEl.innerHTML = "";
      if (!scriptEl.value) scriptEl.value = DEFAULT_SCRIPT;
      poll();
      mqttJoin();
      if (timer) clearInterval(timer);
      timer = setInterval(poll, 700);
    }
    function leave() {}
    async function poll() {
      if (!room) return;
      const { ok, data } = await getJSON("/api/room/" + room + "?after=" + after);
      if (!ok) {
        errEl.textContent = (data && data.error) || "房间连不上";
        return;
      }
      const mqttFresh = lastMqtt && (Date.now() - lastMqtt < 10000) && lastPhone;
      const st = mqttFresh ? lastPhone : data;
      metaEl.innerHTML = "";
      const phoneOn = !!mqttFresh || (data.phoneSeenAt && (Date.now() - data.phoneSeenAt < 20000));
      metaEl.appendChild(pill(phoneOn ? "手机在线" : "等待手机", phoneOn));
      metaEl.appendChild(pill(st.running ? "运行中" : "待命", !!st.running));
      metaEl.appendChild(pill(st.a11y ? "无障碍已开" : "无障碍未开", !!st.a11y));
      metaEl.appendChild(pill(st.step || "—", false));
      if (data.script && !scriptEl.dataset.touched) scriptEl.value = data.script;
      const lines = data.lines || [];
      for (const line of lines) {
        if (seen.has(line.seq)) continue;
        seen.add(line.seq);
        after = Math.max(after, line.seq);
        const row = document.createElement("div");
        row.innerHTML = '<span class="t">' + fmt(line.t) + "</span>" + escapeHtml(line.msg);
        logEl.appendChild(row);
      }
      if (lines.length) logEl.scrollTop = logEl.scrollHeight;
    }
    async function send(run) {
      errEl.textContent = "";
      errEl.className = "err";
      const body = JSON.stringify({ script: scriptEl.value, run: !!run });
      const viaMqtt = mqttPub({ type: "script", script: scriptEl.value, run: !!run });
      const { ok, data } = await getJSON("/api/room/" + room + "/script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body
      });
      if (viaMqtt) {
        errEl.className = "err ok";
        errEl.textContent = run ? "已通过 MQTT 下发并请求运行" : "已通过 MQTT 发送";
        setTimeout(() => { errEl.textContent = ""; errEl.className = "err"; }, 1800);
        if (ok) return;
        return;
      }
      if (!ok) {
        errEl.textContent = (data && data.error) || "发送失败";
        return;
      }
      errEl.className = "err ok";
      errEl.textContent = run ? "已下发并请求运行" : "已发送到房间，等手机拉取";
      setTimeout(() => { errEl.textContent = ""; errEl.className = "err"; }, 1800);
    }
    async function control(action) {
      mqttPub({ type: "control", action: action });
      await getJSON("/api/room/" + room + "/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
    }
    const snips = document.getElementById("snips");
    if (snips) {
      SNIPS.forEach((item) => {
        const b = document.createElement("button");
        b.className = "ghost";
        b.textContent = item.n;
        b.onclick = () => {
          scriptEl.value = item.s;
          scriptEl.dataset.touched = "1";
        };
        snips.appendChild(b);
      });
    }
    document.getElementById("send").onclick = () => send(false);
    document.getElementById("sendRun").onclick = () => send(true);
    document.getElementById("start").onclick = () => control("start");
    document.getElementById("stop").onclick = () => control("stop");
    const shotBtn = document.getElementById("shot");
    if (shotBtn) shotBtn.onclick = () => {
      mqttPub({ type: "shot" });
      addLog("请求截图");
    };
    const grab = document.getElementById("grab");
    const lens = document.getElementById("lens");
    const lensCv = document.getElementById("lensCv");
    const lensTxt = document.getElementById("lensTxt");
    let grabImg = null, grabW = 0, grabH = 0;
    function showShot(data) {
      grabW = Number(data.w) || 0;
      grabH = Number(data.h) || 0;
      const img = new Image();
      img.onload = function () {
        grabImg = img;
        const maxW = Math.min(960, grab.parentElement ? grab.parentElement.clientWidth - 36 : 720);
        const scale = maxW / img.width;
        grab.width = img.width;
        grab.height = img.height;
        grab.style.width = Math.round(img.width * scale) + "px";
        grab.style.height = Math.round(img.height * scale) + "px";
        const ctx = grab.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0);
        addLog("截图 " + grabW + "x" + grabH);
      };
      const mime = data.mime === "jpeg" ? "image/jpeg" : "image/png";
      img.src = "data:" + mime + ";base64," + data.jpeg;
    }
    if (grab) {
      grab.addEventListener("mouseleave", function () {
        if (lens) lens.style.display = "none";
      });
      grab.addEventListener("mousemove", function (e) {
        if (!grab.width) return;
        const r = grab.getBoundingClientRect();
        const x = Math.max(0, Math.min(grab.width - 1, Math.round((e.clientX - r.left) / r.width * grab.width)));
        const y = Math.max(0, Math.min(grab.height - 1, Math.round((e.clientY - r.top) / r.height * grab.height)));
        const ctx = grab.getContext("2d");
        const p = ctx.getImageData(x, y, 1, 1).data;
        const px = grabW ? Math.round(x / grab.width * grabW) : x;
        const py = grabH ? Math.round(y / grab.height * grabH) : y;
        const hex = ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1).toUpperCase();
        if (lensCv) {
          const z = lensCv.getContext("2d");
          z.imageSmoothingEnabled = false;
          const mag = 10;
          z.fillStyle = "#111";
          z.fillRect(0, 0, 120, 120);
          z.drawImage(grab, x - 6, y - 6, 12, 12, 0, 0, 120, 120);
          z.strokeStyle = "#f44";
          z.strokeRect(55, 55, 10, 10);
        }
        if (lensTxt) lensTxt.textContent = px + "," + py + "  " + hex + "  RGB(" + p[0] + "," + p[1] + "," + p[2] + ")";
        if (lens) {
          lens.style.display = "block";
          const left = e.clientX + 18;
          const top = e.clientY + 18;
          lens.style.left = Math.min(left, window.innerWidth - 140) + "px";
          lens.style.top = Math.min(top, window.innerHeight - 160) + "px";
        }
      });
    }
    scriptEl.addEventListener("input", () => { scriptEl.dataset.touched = "1"; });
    enter("LIVE");
  </script>
</body>
</html>
