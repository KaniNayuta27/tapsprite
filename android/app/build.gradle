plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tapsprite.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.tapsprite.agent"
        minSdk 24
        targetSdk 34
        versionCode 101
        versionName "0.9.76"

        // Drop x86/x86_64 emulator ABIs — real devices use arm*; big win vs libonnxruntime*.so ×4.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        debug {
            // default debug keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Keep abiFilters from defaultConfig so debug dist is also slim.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'org.luaj:luaj-jse:3.0.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
}
