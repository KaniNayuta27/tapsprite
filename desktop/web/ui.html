<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>触控精灵 v1.1.75</title>
<link rel="stylesheet" href="/vs/editor/editor.main.css"/>
<style>
:root {
  --bg: #f3f0fa;
  --bg-elev: #ffffff;
  --fg: #1a1430;
  --muted: #746d8c;
  --accent: #6d5ef5;
  --accent-soft: #efeaff;
  --accent-fg: #ffffff;
  --log: #1a1430;
  --log-fg: #d8d3ee;
  --ok: #2f9e6b;
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --shadow: 0 0 0 1px rgba(26,20,48,.06), 0 1px 2px -1px rgba(26,20,48,.06), 0 8px 24px rgba(40,30,80,.05);
  --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
  --motion: 160ms cubic-bezier(0.23, 1, 0.32, 1);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; }
html { -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  display: grid; grid-template-columns: 268px 1fr; height: 100%;
}
button { font-family: inherit; cursor: pointer; }
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
aside {
  background: var(--bg-elev);
  padding: 28px 16px;
  display: flex; flex-direction: column;
  min-height: 0; height: 100%; overflow: hidden;
  box-shadow: 1px 0 0 rgba(26,20,48,.06);
}
.brand { padding: 0 12px 4px; }
.brand h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.03em; text-wrap: balance; }
.brand small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .14em; }
.nav { margin-top: 28px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.nav button {
  text-align: left; border: 0; background: transparent; color: var(--muted);
  padding: 12px 14px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600;
  transition: transform 160ms var(--ease-out), background-color var(--motion), color var(--motion);
}
.nav button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .nav button:hover { background: #f6f3ff; color: var(--fg); }
}
.nav button.on { background: var(--accent-soft); color: var(--fg); }
.stat {
  background: #f7f5ff; border-radius: var(--radius-lg); padding: 14px 16px;
  font-size: 12px; color: var(--muted);
  flex: none;
}
.stat-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 4px;
}
.stat-head b {
  display: block; color: var(--fg); font-size: 13px; font-weight: 650; margin: 0;
  min-width: 0; flex: 1;
}
.stat-upd {
  flex: none; width: 24px; height: 24px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted);
  display: grid; place-items: center; padding: 0;
  margin: -4px -6px 0 0;
  transition: transform 160ms var(--ease-out), background-color var(--motion), color var(--motion);
}
.stat-upd:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .stat-upd:hover { background: #efeaff; color: var(--accent); }
}
.stat-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stat-line #stSub { min-width: 0; }
#stA11y { font-weight: 650; }
#stA11y.on { color: var(--ok); }
#stA11y.off { color: #b42318; }
.devbox { margin: 0 0 14px; }
.devbox label { display: block; font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .12em; margin-bottom: 6px; }
.devrow { display: flex; gap: 8px; align-items: center; }
.devrow select {
  flex: 1; min-width: 0; border: 0; border-radius: 12px; padding: 10px 12px;
  background: #f7f5ff; color: var(--fg); font: 13px/1.3 inherit; font-weight: 600;
}
.devrow .btn.icon { width: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
main { padding: 28px 24px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; height: 100%; }
h1 { margin: 0 0 6px; font-size: 28px; font-weight: 650; letter-spacing: -.03em; text-wrap: balance; }
h1 em { font-style: normal; font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 10px; }
.lede { color: var(--muted); margin: 0 0 22px; font-size: 14px; text-wrap: pretty; }
.card {
  background: var(--bg-elev); border-radius: var(--radius-xl); padding: var(--space-4);
  box-shadow: var(--shadow);
  flex: 1; display: flex; flex-direction: column; min-height: 0;
}
textarea {
  font-family: inherit;
}
.split {
  height: 10px; margin: 2px 0 8px; cursor: ns-resize;
  display: flex; align-items: center; justify-content: center;
}
.split::after {
  content: ""; width: 42px; height: 4px; border-radius: 99px;
  background: #c9c2de; box-shadow: 0 3px 0 #ddd7ee;
}
.script-wrap {
  position: relative; height: 240px; min-height: 120px; flex: none;
  border-radius: var(--radius-md); background: #1a1628; overflow: hidden;
  display: flex; flex-direction: row;
}
.edtools {
  width: 38px; flex: none; display: flex; flex-direction: column; gap: 2px;
  padding: 8px 4px; background: #efeaff; z-index: 2;
  border-right: 1px solid rgba(26,20,48,.06);
}
.edtools button {
  width: 30px; height: 30px; border: 0; border-radius: 8px;
  background: transparent; color: #5c5670;
  display: grid; place-items: center; padding: 0;
  transition: transform 160ms var(--ease-out), background-color var(--motion), color var(--motion);
}
.edtools button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .edtools button:hover { background: #fff; color: var(--accent); }
}
.edtools button.cmt { color: #2f9e6b; }
.edtools button.unc { color: #e44545; }
.edcode { flex: 1; position: relative; min-width: 0; min-height: 0; }
#monaco { position: absolute; inset: 0; }
.monaco-editor, .monaco-editor textarea {
  user-select: text !important; -webkit-user-select: text !important;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn {
  border: 0; height: 40px; min-width: 44px; padding: 0 18px; border-radius: 999px;
  font-weight: 650; font-size: 14px; line-height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  vertical-align: middle;
  transition: transform 160ms var(--ease-out), background-color var(--motion), color var(--motion);
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--accent-soft); color: var(--fg); }
.btn.undo { background: #ece8f5; color: #5c5670; }
.btn.ok { background: #e44545; color: #fff; }
.btn.ok:hover { background: #cc3a3a; }
.btn.save { background: #2f9e6b; color: #fff; }
.btn.save:hover { background: #27885b; }
.log {
  margin-top: 12px; flex: none; min-height: 72px; overflow: auto; font: 12px/1.5 var(--mono);
  background: var(--log); color: var(--log-fg); border-radius: var(--radius-lg); padding: 12px 14px;
  font-variant-numeric: tabular-nums; cursor: text; caret-color: transparent; outline: none;
  user-select: text; -webkit-user-select: text; -webkit-user-drag: none;
}
.log * { user-select: text; -webkit-user-select: text; -webkit-user-drag: none; }
.tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stage-wrap { display: grid; grid-template-columns: 1.4fr minmax(260px, 330px); gap: 14px; min-height: 0; }
.rightcol { display: flex; flex-direction: column; min-height: 0; overflow: auto; gap: 8px; }
.akey {
  margin-top: 8px; padding: 10px 12px; background: #f7f5ff; border-radius: var(--radius-md);
  font: 12px var(--font); color: var(--fg);
}
.akey-title { font-weight: 700; font-size: 13px; margin: 0 0 8px; letter-spacing: .02em; }
.akey-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.akey-tabs button {
  border: 0; background: #e8e3f5; color: #5c5670; border-radius: 8px;
  padding: 6px 8px; font: 600 11px/1.2 var(--font); cursor: pointer;
}
.akey-tabs button.on { background: #fff; color: var(--fg); box-shadow: inset 0 0 0 1px #d9d2ee; }
.akey-pane { display: none; }
.akey-pane.on { display: block; }
.akey-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.akey-row label { min-width: 58px; color: var(--muted); font-weight: 650; font-size: 11px; }
.akey-row input[type=text], .akey-row input[type=number], .akey-row select {
  flex: 1; min-width: 0; border: 1px solid #e4dff2; border-radius: 8px;
  padding: 6px 8px; font: 12px var(--mono); background: #fff; color: var(--fg);
  user-select: text; -webkit-user-select: text;
}
.akey-row input.num { flex: 0 0 52px; width: 52px; }
.akey-row input.sim { flex: 0 0 56px; width: 56px; }
.akey-row .btn { height: 28px; line-height: 28px; font-size: 11px; min-width: 44px; padding: 0 10px; }
.akey-sec { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e4dff2; }
.akey-sec h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.akey-result { font: 12px var(--mono); margin-bottom: 6px; min-height: 18px; white-space: nowrap; display: flex; align-items: baseline; gap: 4px; }
.akey-result b { font-weight: 650; }
.akey .btn.block { width: 100%; margin-top: 6px; }
.akey .btn.primary.block { height: 36px; }
.akey-hidden { display: none !important; }
.stage {
  background: #111018; overflow: auto; height: calc(100vh - 196px);
  position: relative; cursor: crosshair; border-radius: 0; user-select: none;
}
#shot { image-rendering: pixelated; transform-origin: 0 0; display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; }
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot {
  display: grid; grid-template-columns: 22px auto auto; gap: 8px; align-items: center;
  background: #f7f5ff; border-radius: var(--radius-md); padding: 10px 12px; font: 12px var(--mono);
  font-variant-numeric: tabular-nums;
}
.coord, .hexc { cursor: inherit; }
.hexc { min-width: 4.2em; }
.sw { width: 40px; height: 24px; border-radius: 6px; background: repeating-conic-gradient(#ddd 0 25%, #f4f4f4 0 50%) 0 0 / 8px 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.ctx {
  position: fixed; z-index: 40; min-width: 220px; padding: 6px 0;
  background: #fff; color: #222; border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 13px; display: none;
}
.ctx b { display: block; padding: 8px 16px; font-weight: 600; cursor: pointer; }
.ctx b:hover { background: #f3f0fa; }
.ctx hr { border: 0; border-top: 1px solid #eee; margin: 4px 0; }
.cropbox {
  position: absolute; border: 1px dashed var(--accent); background: rgba(109,94,245,.14);
  display: none; pointer-events: none;
}
.cropbox.adjust { pointer-events: auto; }
.cropbox i {
  position: absolute; width: 10px; height: 10px; background: var(--accent);
  border-radius: 1px; pointer-events: auto;
}
.cropbox i::after {
  content: ""; position: absolute; inset: -8px;
}
.cropbox i[data-h=nw] { left: -5px; top: -5px; cursor: nwse-resize; }
.cropbox i[data-h=n]  { left: 50%; top: -5px; margin-left: -5px; cursor: ns-resize; }
.cropbox i[data-h=ne] { right: -5px; top: -5px; cursor: nesw-resize; }
.cropbox i[data-h=e]  { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
.cropbox i[data-h=se] { right: -5px; bottom: -5px; cursor: nwse-resize; }
.cropbox i[data-h=s]  { left: 50%; bottom: -5px; margin-left: -5px; cursor: ns-resize; }
.cropbox i[data-h=sw] { left: -5px; bottom: -5px; cursor: nesw-resize; }
.cropbox i[data-h=w]  { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
.selbox {
  position: absolute; border: 1px dashed #e8c547; background: rgba(232,197,71,.12);
  display: none; pointer-events: none;
}
.meas {
  margin-top: 12px; padding: 12px; background: #f7f5ff; border-radius: var(--radius-md);
  font: 12px var(--mono); color: var(--fg);
}
.meas input {
  width: 44px; margin: 0 4px 0 0; border: 1px solid #e4dff2; border-radius: 8px;
  padding: 6px 6px; font: 12px var(--mono); background: #fff; color: var(--fg);
  user-select: text; -webkit-user-select: text; -webkit-user-drag: none;
}
.measrow { display: flex; align-items: center; flex-wrap: nowrap; }
.measrow .btn { margin-left: auto; }
.meas .sz { color: var(--muted); margin: 0; }
.szrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.szrow .sz { flex: 1; }
.meas .btn { height: 32px; line-height: 32px; font-size: 12px; min-width: 52px; }
.origin {
  margin-bottom: 10px; padding: 10px 12px; background: #f7f5ff; border-radius: var(--radius-md);
  font: 12px var(--mono); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.origin input {
  width: 44px; margin: 0 4px 0 0; border: 1px solid #e4dff2; border-radius: 8px;
  padding: 6px 6px; font: 12px var(--mono); background: #fff; color: var(--fg);
  user-select: text; -webkit-user-select: text; -webkit-user-drag: none;
}
.origin .btn { height: 28px; line-height: 28px; font-size: 12px; padding: 0 10px; }
.hud {
  position: fixed; pointer-events: none; z-index: 9; display: none;
  background: #111018; color: #fff; font: 12px/1.4 var(--mono); padding: 6px; border-radius: 8px;
  box-shadow: var(--shadow);
}
.hud canvas { display: block; width: 120px; height: 120px; image-rendering: pixelated; background: #222; }
.hud .t { margin-top: 6px; white-space: pre; font-variant-numeric: tabular-nums; }
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: grid; grid-template-columns: 22px auto auto; gap: 8px; align-items: center;
  background: #f7f5ff; border-radius: var(--radius-md); padding: 8px 10px; font: 12px var(--mono);
  font-variant-numeric: tabular-nums;
}
.sw { width: 28px; height: 18px; border-radius: 6px; background: #ddd; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
#page-home { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; overflow: hidden; }
#page-grab { display: none; flex: 1; min-height: 0; height: 100%; }
#toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 50;
  max-width: min(440px, 86vw); padding: 12px 16px; border-radius: 14px;
  background: #3a1730; color: #ffe8ea; font-size: 13px; font-weight: 650;
  box-shadow: 0 12px 32px rgba(40,16,30,.28);
  opacity: 0; pointer-events: none;
  transform: translateX(-50%) translateY(8px) scale(0.97);
  transform-origin: 50% 100%;
  transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
}
#toast.on {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0) scale(1);
}
#toast.ok { background: #173a2a; color: #e8fff4; }
@media (prefers-reduced-motion: reduce) {
  .btn, .nav button, #toast { transition: opacity 160ms ease; }
  .btn:active, .nav button:active { transform: none; }
  #toast { transform: translateX(-50%); }
}

#updateBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  display: none; align-items: center; gap: 10px;
  padding: 6px 16px 8px; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(243,240,250,.92) 30%);
  font: 600 12px/1.3 var(--font); color: #1b7a4a;
}
#updateBar.on { display: flex; }
#updateBar .track {
  flex: 1; max-width: 220px; height: 3px; border-radius: 2px;
  background: rgba(47,158,107,.18); overflow: hidden;
}
#updateBar .fill {
  height: 100%; width: 0%; background: #2f9e6b; border-radius: 2px;
  transition: width 160ms ease;
}
#updateBar.err { color: #b42318; }
#updateBar.err .fill { background: #b42318; }
</style>
</head>
<body>
<aside>
  <div class="brand"><h2>触控精灵</h2><small>TAPSPRITE PC · v1.1.75</small></div>
  <div class="nav">
    <button class="on" id="navHome">控制台</button>
    <button id="navGrab">抓抓</button>
  </div>
  <div class="devbox">
    <label>设备</label>
    <div class="devrow">
      <select id="devSel"><option value="">等待设备</option></select>
      <button class="btn ghost icon" id="devRef" title="刷新" aria-label="刷新">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.3-6"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </div>
  <div class="stat">
    <div class="stat-head">
      <b id="stTitle">正在连接</b>
      <button type="button" class="stat-upd" id="upd" title="检查更新" aria-label="检查更新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
    <div class="stat-line">
      <span id="stSub"></span>
      <span id="stA11y"></span>
    </div>
  </div>
</aside>
<main>
  <section id="page-home">
    <h1>控制台</h1>
    <p class="lede">手机 App 开着即可下发。保存截图走系统另存为，不会下载到浏览器。</p>
    <div class="card">
      <div class="script-wrap" id="edWrap">
      <div class="edtools">
        <button type="button" id="edSave" title="保存到桌面 (Ctrl+S)" aria-label="保存"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        <button type="button" class="cmt" id="edCmt" title="注释" aria-label="注释" style="font:700 13px/1 var(--mono)">//</button>
        <button type="button" class="unc" id="edUnc" title="取消注释" aria-label="取消注释" style="font:700 16px/1 var(--font)">×</button>
        <button type="button" id="edFind" title="查找 (Ctrl+F)" aria-label="查找"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg></button>
        <button type="button" id="edRep" title="替换 (Ctrl+H)" aria-label="替换"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3 21 7l-4 4"/><path d="M21 7H8"/><path d="m7 21-4-4 4-4"/><path d="M3 17h13"/></svg></button>
        <button type="button" id="edChk" title="语法检测" aria-label="语法检测"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
        <button type="button" id="fmtBtn" title="整理缩进" aria-label="缩进"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h12"/><path d="M3 18h18"/></svg></button>
      </div>
      <div class="edcode"><div id="monaco"></div></div>
      </div>
      <div id="hint" hidden></div>
      <div class="split" id="split"></div>
      <div class="row">
        <button class="btn primary" id="send">发送到手机</button>
        <button class="btn ghost" id="sendRun">发送并运行</button>
        <button class="btn ghost" id="start">开始</button>
        <button class="btn ghost" id="stop">停止</button>
      </div>
      <div class="log" id="log" tabindex="0"></div>
    </div>
  </section>
  <section id="page-grab">
    <h1>抓抓</h1>
    <p class="lede">拖出选区后可调框，回车确认裁剪。保存只在裁剪后出现。</p>
    <div class="tools">
      <button class="btn primary" id="shotBtn">截屏</button>
      <button class="btn ghost" id="cropBtn">裁剪</button>
      <button class="btn ghost" id="rotL">左转 90°</button>
      <button class="btn ghost" id="rotR">右转 90°</button>
      <button class="btn undo" id="undoBtn" style="display:none">回退</button>
      <button class="btn save" id="saveBtn" style="display:none">保存</button>

async function refreshShot(keepZoom) {
  const s = await fetch("/api/frame").then(r => r.json());

  shot.src = "data:image/png;base64," + s.b64;
  if (!keepZoom) {
    zoom = 1;
    shot.style.transform = "scale(1)";
    fitPending = true;
  }
}
function fitZoom() {
  if (!shot.naturalWidth) return 1;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!sw || !sh) return 1;
  return Math.min(sw / shot.naturalWidth, sh / shot.naturalHeight);
}
const stage = document.getElementById("stage");
shot.draggable = false;
shot.addEventListener("dragstart", (e) => e.preventDefault());
stage.addEventListener("wheel", (e) => {
  if (e.ctrlKey) {
    e.preventDefault();
    if (e.deltaY > 0 && fitPending) {
      fitPending = false;

    } else {
      fitPending = false;
      zoom *= e.deltaY < 0 ? 1.12 : 0.89;
    }
    zoom = Math.max(0.05, Math.min(12, zoom));
    shot.style.transform = "scale(" + zoom + ")";
    layoutCrop();
    layoutSel();
    return;
  }
  e.preventDefault();
  if (e.shiftKey) {
    stage.scrollLeft += e.deltaY;
  } else {

  }
}, { passive: false });
function layoutSel() {

  const left = r.left + x1 / shot.naturalWidth * r.width - st.left + stage.scrollLeft;
  const top = r.top + y1 / shot.naturalHeight * r.height - st.top + stage.scrollTop;
  selbox.style.display = "block";
  selbox.style.left = left + "px";
  selbox.style.top = top + "px";
  selbox.style.width = Math.max(1, (x2 - x1) / shot.naturalWidth * r.width) + "px";
  selbox.style.height = Math.max(1, (y2 - y1) / shot.naturalHeight * r.height) + "px";
}
function fillMeas() {
  if (!selRect) return;

  document.getElementById("my2").value = y2;

}
function clearSel() {

  selbox.style.display = "none";
}
document.getElementById("copyRect").onclick = () => {

  const x2 = document.getElementById("mx2").value || "0";

function measNums() {
  return ["mx1", "my1", "mx2", "my2"].map((id) => {
    const v = document.getElementById(id).value.trim();
    if (v === "" || v === "-") return null;

}
function updateMeasSize() {

["mx1", "my1", "mx2", "my2", "ox", "oy"].forEach((id) => {

document.getElementById("cropRange").onclick = () => {

function layoutCrop() {

stage.addEventListener("mousemove", async (e) => {

        layoutSel();
        fillMeas();
      }

    return;

        if (dragMode === "draw") { cropRect.x2 = pt.x; cropRect.y2 = pt.y; }

          const dx = pt.x - dragMode.lx, dy = pt.y - dragMode.ly;
          cropRect.x1 += dx; cropRect.y1 += dy; cropRect.x2 += dx; cropRect.y2 += dy;
          dragMode.lx = pt.x; dragMode.ly = pt.y;

        if (dragMode.indexOf("n") >= 0) cropRect.y1 = pt.y;
        if (dragMode.indexOf("s") >= 0) cropRect.y2 = pt.y;
        if (dragMode.indexOf("w") >= 0) cropRect.x1 = pt.x;

    const ed = monaco.editor.create(document.getElementById("monaco"), {

    window.ed = ed;

    document.getElementById("fmtBtn").onclick = function () {

(function () {
  const wrap = document.getElementById("edWrap");
  const sp = document.getElementById("split");
  const logBox = document.getElementById("log");
  const card = wrap.closest(".card");
  const row = card.querySelector(".row");
  let ratio = 2 / 3;
  function space() {
    const pad = 32;
    const extra = sp.offsetHeight + 10 + row.offsetHeight + 14 + 12;
    return Math.max(200, card.clientHeight - pad - extra);
  }
  function apply() {
    const avail = space();
    const r = Math.min(2 / 3, Math.max(0.35, ratio));
    const taH = Math.round(avail * r);
    wrap.style.flex = "none";
    logBox.style.flex = "none";
    wrap.style.height = taH + "px";
    logBox.style.height = (avail - taH) + "px";
    if (window.ed) window.ed.layout();
  }
  apply();
  requestAnimationFrame(apply);
  let drag = false, y0 = 0, h0 = 0, avail0 = 0;
  sp.addEventListener("mousedown", (e) => {
    drag = true;
    y0 = e.clientY;
    h0 = wrap.getBoundingClientRect().height;
    avail0 = space();
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    const minH = Math.round(avail0 * 0.35);
    const maxH = Math.round(avail0 * 2 / 3);
    const taH = Math.max(minH, Math.min(maxH, h0 + e.clientY - y0));
    ratio = taH / avail0;
    wrap.style.height = taH + "px";
    logBox.style.height = (avail0 - taH) + "px";
    if (window.ed) window.ed.layout();
  });
  window.addEventListener("mouseup", () => { drag = false; });
  window.addEventListener("resize", apply);
  if (window.ResizeObserver) new ResizeObserver(apply).observe(card);
})();
function hideCtx() { document.getElementById("ctxm").style.display = "none"; }
async function showGrabMenu(e) {
  hideHud();
  const pt = imgXY(e);
  let p = window._px || {};
  if (pt) {
    try {
      const q = await fetch("/api/pixel?x=" + pt.x + "&y=" + pt.y).then(r => r.json());
      if (q && q.ok) { p = q; window._px = q; }
      else { p = { x: pt.x, y: pt.y, hex: (p.hex || "") }; }
    } catch (_) {
      p = { x: pt.x, y: pt.y, hex: (p.hex || "") };
    }
  }
  const x = p.x, y = p.y, hex = (p.hex || "").replace("#", "");
  const m = document.getElementById("ctxm");
  let html = "";
  if (x != null && y != null) {
    html += '<b data-a="xy">复制当前坐标(' + x + "," + y + ")</b>";
    html += '<b data-a="hex">复制当前颜色(' + hex + ")</b><hr>";
  }
  for (let i = 1; i <= 10; i++) html += '<b data-a="slot" data-i="' + i + '">加入到"点' + i + '"</b>';
  m.innerHTML = html;
  m.style.display = "block";
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(e.clientX, innerWidth - w - 8) + "px";
  m.style.top = Math.min(e.clientY, innerHeight - h - 8) + "px";
  m.onclick = (ev) => {
    const b = ev.target.closest("b");
    if (!b) return;
    ev.preventDefault();
    ev.stopPropagation();
    const a = b.getAttribute("data-a");
    if (a === "xy") copyText(x + ", " + y);
    if (a === "hex") copyText(hex);
    if (a === "slot") {
      const n = Number(b.getAttribute("data-i"));
      const i = n === 10 ? 9 : n - 1;
      if (x == null || y == null) { toast("无像素坐标"); hideCtx(); return; }
      api("/api/slot", { i, x: x|0, y: y|0 }).then((r) => { if (r) renderSlots(r); });
    }
    hideCtx();
  };
}
document.addEventListener("click", hideCtx);
document.addEventListener("contextmenu", (e) => {
  if (e.target.closest(".monaco-editor, .monaco-menu, .shadow-root-host, .ctx")) return;
  e.preventDefault();
  e.stopPropagation();
  const st = document.getElementById("stage");
  if (st && (st === e.target || st.contains(e.target))) showGrabMenu(e);

/* ---- 仿按键抓抓 ---- */
let akeyTab = "multicolor";
function akeyEls() {
  return {
    desc: document.getElementById("akColorDesc"),
    path: document.getElementById("akPicPath"),
    dir: document.getElementById("akDir"),
    sim: document.getElementById("akSim"),
    delta: document.getElementById("akDelta"),
    result: document.getElementById("akResult"),
  };
}
function setAkeyTab(tab) {
  akeyTab = tab;
  document.querySelectorAll("#akeyTabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const showColor = tab !== "pic";
  const showPath = tab === "pic";
  const showDir = tab !== "cmpex"; // 相似度 stays; only hide 查找方向 on cmpex
  const showDelta = tab === "pic";
  document.querySelectorAll("#akeyPanel [data-f=color]").forEach(el => el.classList.toggle("akey-hidden", !showColor));
  document.querySelectorAll("#akeyPanel [data-f=path]").forEach(el => el.classList.toggle("akey-hidden", !showPath));
  document.querySelectorAll("#akeyPanel [data-f=dir]").forEach(el => {
    el.classList.toggle("akey-hidden", !showDir);
    if (el.style) el.style.display = showDir ? "inline-flex" : "none";
  });
  document.querySelectorAll("#akeyPanel [data-f=delta]").forEach(el => {
    el.classList.toggle("akey-hidden", !showDelta);
    el.style.display = showDelta ? "inline-flex" : "none";
  });
  const lab = document.querySelector('#akeyPanel [data-f=color] label');
  if (lab) lab.textContent = "颜色描述";
}
function parseMultiColorDesc(raw) {
  let s = (raw || "").trim();
  if (!s) return { first: "", offset: "" };
  // "first", "offset" or first,offset
  let m = s.match(/^"([^"]*)"\s*,\s*"([\s\S]*)"$/);
  if (m) return { first: m[1], offset: m[2] };
  m = s.match(/^'([^']*)'\s*,\s*'([\s\S]*)'$/);
  if (m) return { first: m[1], offset: m[2] };
  m = s.match(/^"([^"]*)"\s*,\s*([\s\S]+)$/);
  if (m) return { first: m[1], offset: m[2].replace(/^"|"$/g, "").trim() };
  // first color then comma then offset points (dx|dy|c,...)
  m = s.match(/^([0-9A-Fa-f#xX-]{3,})\s*,\s*([\s\S]+)$/);
  if (m && /\|/.test(m[2])) return { first: m[1], offset: m[2].trim() };
  return { first: s.replace(/^"|"$/g, ""), offset: "" };
}
function akeyRange() {
  // L,T,R,B from the existing right-side crop boxes (#mx1 #my1 #mx2 #my2), not deleted akL..akB.
  const x1 = parseInt(document.getElementById("mx1").value, 10) || 0;
  const y1 = parseInt(document.getElementById("my1").value, 10) || 0;
  const x2 = parseInt(document.getElementById("mx2").value, 10) || 0;
  const y2 = parseInt(document.getElementById("my2").value, 10) || 0;
  return {
    l: Math.min(x1, x2),
    t: Math.min(y1, y2),
    r: Math.max(x1, x2),
    b: Math.max(y1, y2),
  };
}
function akeySim() {
  const v = parseFloat(akeyEls().sim.value);
  return Number.isFinite(v) ? v : 0.9;
}
function akeyDir() {
  return parseInt(akeyEls().dir.value, 10) || 0;
}
function buildAkeyScript() {
  const rg = akeyRange();
  const sim = akeySim();
  const dir = akeyDir();
  const e = akeyEls();
  if (akeyTab === "multicolor") {
    const { first, offset } = parseMultiColorDesc(e.desc.value);
    return `intX, intY = FindMultiColor(${rg.l}, ${rg.t}, ${rg.r}, ${rg.b}, "${first}", "${offset}", ${dir}, ${sim})
if intX > -1 and intY > -1 then
    TracePrint(intX)
    TracePrint(intY)
end`;
  }
  if (akeyTab === "color") {
    const color = (e.desc.value || "").trim().replace(/^"|"$/g, "");
    return `intX, intY = FindColor(${rg.l}, ${rg.t}, ${rg.r}, ${rg.b}, "${color}", ${dir}, ${sim})
if intX > -1 and intY > -1 then
    TracePrint(intX)
    TracePrint(intY)
end`;
  }
  if (akeyTab === "cmpex") {
    const desc = (e.desc.value || "").trim().replace(/^"|"$/g, "");
    return `if CmpColorEx("${desc}", ${sim}) then
    TracePrint("match")
end`;
  }
  if (akeyTab === "pic") {
    const path = (e.path.value || "").trim();
    const delta = (e.delta.value || "000000").trim();
    return `intX, intY = FindPic(${rg.l}, ${rg.t}, ${rg.r}, ${rg.b}, "${path}", "${delta}", ${dir}, ${sim})
if intX > -1 and intY > -1 then
    TracePrint(intX)
    TracePrint(intY)
end`;
  }
  return "";
}
async function runAkeyTest() {
  const e = akeyEls();
  e.result.textContent = "…";
  const rg = akeyRange();
  const sim = akeySim();
  const dir = akeyDir();
  let payload = { kind: akeyTab, l: rg.l, t: rg.t, r: rg.r, b: rg.b, dir, sim, first: "", offset: "", path: "" };
  if (akeyTab === "multicolor") {
    const p = parseMultiColorDesc(e.desc.value);
    payload.first = p.first; payload.offset = p.offset;
  } else if (akeyTab === "color" || akeyTab === "cmpex") {
    payload.first = (e.desc.value || "").trim().replace(/^"|"$/g, "");
  } else if (akeyTab === "pic") {
    payload.path = (e.path.value || "").trim();
    payload.delta = (e.delta.value || "").trim();
    if (!payload.path) {
      e.result.textContent = "请先填图片路径";
      toast("请先填图片路径");
      return;
    }
  }
  try {
    const r = await api("/api/findtest", payload);
    if (r && r.err) {
      e.result.textContent = r.result || "-1,-1";
      toast(r.err);
      return;
    }
    e.result.textContent = (r && r.result != null) ? r.result : "-1,-1";
  } catch (err) {
    e.result.textContent = "-1,-1";
    toast("测试失败");
  }
}
(function initAkey() {
  const tabs = document.getElementById("akeyTabs");
  if (!tabs) return;
  tabs.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-tab]");

    setAkeyTab(b.dataset.tab);
  });
  setAkeyTab("multicolor");
  document.getElementById("akCopyDesc").onclick = () => {

  };

    const f = ev.target.files && ev.target.files[0];

      // file path not available in browser; keep name as placeholder

      toast("已填文件名（完整路径请手改）", "ok");
    }
  };
  document.getElementById("akTest").onclick = () => runAkeyTest();
  document.getElementById("akCopyScript").onclick = () => {
    const s = buildAkeyScript();
    copyText(s);
    toast("已复制完整脚本", "ok");
  };
})();
