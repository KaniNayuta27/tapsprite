<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>触控精灵 · 文档</title>
<style>
:root {
  --bg: #f3f0fa; --card: #fff; --fg: #1a1430; --muted: #746d8c; --accent: #6d5ef5; --soft: #efeaff; --line: rgba(26,20,48,.08);
  --font: "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --mono: Consolas,"Cascadia Mono","Microsoft YaHei UI",monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); display: grid; grid-template-columns: 260px 1fr; }
#gate {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--bg);
}
body.in #gate { display: none; }
body:not(.in) aside, body:not(.in) main { visibility: hidden; }
.box { width: min(360px, 92vw); background: #fff; padding: 28px 24px; border-radius: 20px; box-shadow: 0 8px 24px rgba(40,30,80,.06); }
.box h1 { margin: 0 0 6px; font-size: 22px; }
.box p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.box input { width: 100%; padding: 12px 14px; border: 1px solid #e4dff2; border-radius: 12px; font: 16px inherit; outline: none; }
.box button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 650 15px inherit; cursor: pointer; }
.err { color: #c45c4a; font-size: 13px; min-height: 1.2em; margin-top: 8px; }
aside {
  background: #fff; border-right: 1px solid var(--line); overflow: auto; padding: 18px 12px 32px;
}
aside .brand { display: block; font-weight: 700; padding: 6px 10px 14px; color: var(--fg); text-decoration: none; }
.search { width: 100%; border: 1px solid #e4dff2; border-radius: 10px; padding: 8px 10px; font: 13px inherit; margin-bottom: 12px; outline: none; }
.search:focus { border-color: var(--accent); }
.cat {
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: 0; background: transparent; cursor: pointer; text-align: left;
  font: 650 15px/1.35 var(--font); color: var(--fg);
  padding: 14px 10px 6px; letter-spacing: 0;
}
.cat:hover { color: var(--accent); }
.cat .arr { font-size: 11px; color: var(--muted); width: 12px; }
.group.hide { display: none; }
aside a.item {
  display: block; padding: 7px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 13.5px;
}
aside a.item:hover { background: var(--soft); }
aside a.item.on { background: var(--accent); color: #fff; }
main { overflow: auto; padding: 36px 40px 80px; }
h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
.sig {
  font-family: var(--mono); background: #1a1430; color: #d8d3ee; padding: 12px 14px; border-radius: 12px;
  white-space: pre-wrap; font-size: 13px;
}
.desc { color: var(--fg); margin: 16px 0; max-width: 44em; }
table { width: 100%; max-width: 640px; border-collapse: collapse; font-size: 14px; margin: 8px 0 18px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; }
pre {
  background: #1a1430; color: #d8d3ee; padding: 14px 16px; border-radius: 12px;
  overflow: auto; font: 13px/1.5 var(--mono); max-width: 720px;
}
h3 { font-size: 13px; color: var(--muted); font-weight: 650; margin: 20px 0 8px; letter-spacing: .06em; }
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; }
  aside { height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="f">
    <h1>触控精灵</h1>
    <p>输入密码后查看文档。</p>
    <input id="p" type="password" autofocus placeholder="密码" autocomplete="current-password"/>
    <button type="submit">进入</button>
    <div class="err" id="e"></div>
  </form>
</div>
<aside>
  <a class="brand" href="/">← 触控精灵</a>
  <input class="search" id="q" placeholder="搜索命令"/>
  <div id="nav"></div>
</aside>
<main id="main"></main>
<script src="/docs-data.js"></script>
<script>
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const q = document.getElementById("q");
const closed = {};
function filtered() {
  const s = q.value.trim().toLowerCase();
  if (!s) return TS_DOCS;
  return TS_DOCS.filter(d => (d.name + d.sig + d.desc + d.id).toLowerCase().indexOf(s) >= 0);
}
function renderNav(id) {
  const list = filtered();
  const searching = q.value.trim().length > 0;
  let html = "";
  let last = "";
  list.forEach(d => {
    if (d.cat !== last) {
      if (last) html += "</div>";
      const off = !searching && closed[d.cat];
      html += "<button type='button' class='cat" + (off ? " off" : "") + "' data-cat='" + d.cat + "'>" +
        "<span class='arr'>" + (off ? "▸" : "▾") + "</span>" + d.cat + "</button>";
      html += "<div class='group" + (off ? " hide" : "") + "'>";
      last = d.cat;
    }
    html += "<a class='item" + (d.id === id ? " on" : "") + "' href='#/" + d.id + "'>" + d.name + "</a>";
  });
  if (last) html += "</div>";
  nav.innerHTML = html || "<div class='cat'>没有匹配</div>";
}
nav.addEventListener("click", (e) => {
  const b = e.target.closest(".cat");
  if (!b || !b.dataset.cat) return;
  e.preventDefault();
  const c = b.dataset.cat;
  closed[c] = !closed[c];
  renderNav((location.hash || "").replace(/^#\//, ""));
});
function show(id) {
  const d = TS_DOCS.find(x => x.id === id) || TS_DOCS[0];
  history.replaceState(null, "", "#/" + d.id);
  if (d.cat) closed[d.cat] = false;
  renderNav(d.id);
  let params = "";
  if (d.params && d.params.length) {
    params = "<h3>参数</h3><table><tr><th>名</th><th>类型</th><th>说明</th></tr>" +
      d.params.map(p => "<tr><td>" + p[0] + "</td><td>" + p[1] + "</td><td>" + p[2] + "</td></tr>").join("") +
      "</table>";
  }
  main.innerHTML = "<h1>" + d.name + "</h1>" +
    (d.sig ? "<div class='sig'>" + d.sig.replace(/</g,"<") + "</div>" : "") +
    "<p class='desc'>" + d.desc + "</p>" + params +
    (d.example ? "<h3>示例</h3><pre>" + d.example.replace(/</g,"<") + "</pre>" : "");
}
window.addEventListener("hashchange", () => show((location.hash || "").replace(/^#\//, "")));
q.addEventListener("input", () => {
  const list = filtered();
  renderNav((location.hash || "").replace(/^#\//, ""));
  if (list.length && !list.find(d => d.id === (location.hash || "").replace(/^#\//, ""))) show(list[0].id);
});
show((location.hash || "").replace(/^#\//, "") || "intro");
</script>
<script src="/auth.js"></script>
<script>tsAuth.bind("f", "p", "e");</script>
</body>
</html>
