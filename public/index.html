<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>触控精灵</title>
<script src="/auth.js"></script>
<script>tsAuth.require()</script>
<style>
:root {
  --bg: #f3f0fa; --card: #fff; --fg: #1a1430; --muted: #746d8c; --accent: #6d5ef5; --soft: #efeaff;
  --font: "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --shadow: 0 0 0 1px rgba(26,20,48,.08), 0 8px 24px rgba(40,30,80,.06);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font); }
a { color: var(--accent); text-decoration: none; }
.wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }
.kicker { font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 650; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 650; letter-spacing: -.03em; margin: 8px 0 10px; }
.lede { color: var(--muted); max-width: 38em; margin: 0 0 28px; }
.dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .dl { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: 20px; padding: 20px 22px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 18px; }
.card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.ver { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.btn { display: inline-block; background: var(--accent); color: #fff; font-weight: 650; padding: 11px 16px; border-radius: 12px; font-size: 14px; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn:hover { text-decoration: none; }
ol { margin: 0; padding-left: 20px; }
ol li { margin: 8px 0; }
.row { margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">TAPSPRITE</div>
  <h1>触控精灵</h1>
  <p class="lede">电脑客户端下发脚本和截图。这个网页只提供安装包和命令文档。</p>
  <div class="dl">
    <div class="card">
      <h2>电脑客户端</h2>
      <p>Windows。下发、抓抓、截图。</p>
      <div class="ver" id="exeVer"></div>
      <a class="btn" href="/tapsprite.exe">下载 tapsprite.exe</a>
    </div>
    <div class="card">
      <h2>手机 App</h2>
      <p>Android / 模拟器。打开无障碍。</p>
      <div class="ver" id="apkVer"></div>
      <a class="btn ghost" href="/tapsprite.apk">下载 tapsprite.apk</a>
    </div>
  </div>
  <div class="card row">
    <h2>开始</h2>
    <ol>
      <li>打开 exe。SmartScreen 点「仍要运行」。</li>
      <li>安装 App，打开无障碍。</li>
      <li>电脑左侧选出设备后下发脚本或截图。</li>
    </ol>
    <p style="margin:16px 0 0"><a class="btn" href="/docs.html">命令文档</a></p>
  </div>
</div>
<script>
fetch("/version.json").then(r => r.json()).then(v => {
  document.getElementById("exeVer").textContent = "当前 " + (v.exe_ver || "");
  document.getElementById("apkVer").textContent = "当前 " + (v.apk_ver || "");
}).catch(() => {});
</script>
</body>
</html>
